name: deploy

on:
  push:
    branches: [week4]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml
  build:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        include:
          - service: back
            context: ./back

          - service: front
            context: ./front
            build_arg: "VITE_API_URL"
    steps:
      - uses: actions/checkout@v4

      - name: Вход в Docker
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build и push образа с двумя тегами
        env:
          IMAGE_SHA: ${{ secrets.DOCKER_USER }}/todo-${{matrix.service}}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ secrets.DOCKER_USER }}/todo-${{matrix.service}}:latest
          BUILD_ARG: ${{ matrix.build_arg }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          cd ${{ matrix.context }}
          docker build ${BUILD_ARG:+--build-arg $BUILD_ARG=$VITE_API_URL} -t $IMAGE_SHA -t $IMAGE_LATEST .
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST
  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            pwd
            cd /home/deploy/vchch.xyz/
            pwd
            touch test.txt
            pwd >> test.txt
          EOF

  verify:
    needs: [ deploy ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        env:
          E2E_BASE_URL: ${{ vars.VITE_API_URL }}
        run: |
          E2E_BASE_URL="$(printf '%s' "$E2E_BASE_URL" | tr -d '\r\n')"
          export E2E_BASE_URL="${E2E_BASE_URL%/api}"
          bash scripts/smoke.sh
  

  notify:
    needs: [ checks, build, deploy, verify ]
    if: always()
    uses: ./.github/workflows/notify.yaml
    secrets: inherit
    with:
      checks_result: ${{ needs.checks.result }}
      build_result: ${{ needs.build.result }}
      deploy_result: ${{ needs.deploy.result }}
      verify_result: ${{ needs.verify.result }}
